<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kibu</title>

    <!-- google icon css link -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <!-- main css file -->
    <link rel="stylesheet" href="../style.css" />

    <link rel="stylesheet" href="./Login.css" />

    <link rel="stylesheet" href="contectUs.css" />
  </head>
  <body>
    <nav>
      <div class="nav-bar sticky">
        <div class="logo">
          <!-- Example logo -->
          <a class="material-symbols-outlined pointer" href="../index.html"> flutter </a>
          <a class="pointer kibu-text" href="../index.html">Kibu</a>
        </div>

        <div class="shortcut">
          <ul class="nav-ul">
            <li class="pointer text-underline"><a href="../index.html">Home</a></li>
            <li class="pointer text-underline">
              <a href="../contectUs/contectUs.html">Contact Us</a>
            </li>
            <li class="pointer text-underline"><a href="../upload/upload.html">Upload</a></li>
            <li class="pointer text-underline"><a href="#">Downloads</a></li>
          </ul>
        </div>

        <div class="user">
          <a class="login-div pointer" href="./Login.html">Login</a>
          <div class="profile-div pointer">
            <span class="material-symbols-outlined"> person </span>
          </div>
        </div>
      </div>
    </nav>

    <div class="main-div">
      <div class="sidebar">
        <ul class="sidebar-ul">
          <li class="flex aline-center sidebar-li pointer">
            <span class="material-symbols-outlined"> upload </span
            ><span>Upload</span>
          </li>
          <li class="flex aline-center sidebar-li pointer">
            <span class="material-symbols-outlined"> download </span>Downloads
          </li>
          <li class="flex aline-center sidebar-li pointer">
            <span class="material-symbols-outlined"> favorite </span
            ><span>Liked</span>
          </li>
        </ul>

        <div class="upload-button">
          <button class="button-style pointer">Upload</button>
        </div>
      </div>


      <div class="content-area">
        <h1>Login</h1>
        <form action="">
          <label for="name">Username</label>
          <input id="name" type="text" placeholder="Enter your username" />
          <label for="email">Password</label>
          <input id="email" type="text" placeholder="Enter your password" />
          <div class="forgot">
            <a class="blue-ancre" href="#">Forgot your password? Reset it</a>
          </div>
          <button id="button2" class="pointer">Login</button>
          <div class="register">
            <a class="blue-ancre" href="#">Don't have an account? Register</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
