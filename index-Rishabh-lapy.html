<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kibu</title>

    <!-- google icon css link -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <!-- main css file -->
    <link rel="stylesheet" href="./style.css" />

    <!-- home page css -->
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <nav>
      <div class="nav-bar sticky">
        <div class="logo">
          <!-- Example logo -->
          <a class="material-symbols-outlined pointer" href="./index.html"> flutter </a>
          <a class="pointer kibu-text" href="./index.html">Kibu</a>
        </div>

        <div class="shortcut">
          <ul class="nav-ul">
            <li class="pointer active text-underline"><a href="./index.html">Home</a></li>
            <li class="pointer text-underline">
              <a href="../contectUs/contectUs.html">Contact Us</a>
            </li>
            <li class="pointer text-underline"><a href="./upload/upload.html">Upload</a></li>
            <li class="pointer text-underline"><a href="#">Downloads</a></li>
          </ul>
        </div>

        <div class="user">
          <a class="login-div pointer" href="./Login/Login.html">Login</a>
          <div class="profile-div pointer">
            <span class="material-symbols-outlined"> person </span>
          </div>
        </div>
      </div>
    </nav>

    <div class="main-div">
      <div class="sidebar">
        <ul class="sidebar-ul">
          <li class="flex aline-center sidebar-li pointer">
            <span class="material-symbols-outlined"> upload </span
            ><span>Upload</span>
          </li>
          <li class="flex aline-center sidebar-li pointer">
            <span class="material-symbols-outlined"> download </span>Downloads
          </li>
          <li class="flex aline-center sidebar-li pointer">
            <span class="material-symbols-outlined"> favorite </span
            ><span>Liked</span>
          </li>
        </ul>

        <div class="upload-button">
          <button class="button-style pointer">Upload</button>
        </div>
      </div>

      <div class="content-area">
        <div class="search-bar">
          <div class="search-icon">
            <div class="material-symbols-outlined search-logo pointer">
              search
            </div>
          </div>
          <form>
            <input
              id="input-search"
              type="text"
              placeholder="Search for images and videos."
            />
          </form>
        </div>

        <!-- form script -->
        <script src="home.js"></script>
        <div class="break"></div>
        <div class="flex image-video-selector">
          <span class="images pointer text-underline">Images</span>
          <p class="videos pointer text-underline">videos</p>
        </div>

        <div class="search-results"></div>
      </div>
    </div>
  </body>
</html>
